version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone_revenue_api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=cs-train
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
